<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scores</title>
<style>
  /* The same two palettes gscore uses, so the shelf and the editor look
     like one thing, and the dark one is a real choice rather than an
     inversion. */
  :root {
    color-scheme: light;
    --bg: #d9d6d0; --panel: #e8e6e1; --ink: #1c1a18; --muted: #6d6862;
    --line: #a9a49b; --accent: #2f6f9f; --accent-soft: #cfe2f0;
    --paper: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #23211f; --panel: #2c2a27; --ink: #eceae6; --muted: #9a948c;
      --line: #45413c; --accent: #6ba7d6; --accent-soft: #2a4357;
      --paper: #f7f6f3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 48px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 0 14px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.01em; }
  .count { color: var(--muted); font-size: 14px; }

  .controls {
    max-width: 1100px; margin: 0 auto 18px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  #q {
    flex: 1 1 14em; min-width: 12em;
    padding: 7px 11px; font: inherit;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--paper); color: #1c1a18;
  }
  .tag {
    padding: 4px 10px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: inherit;
  }
  .tag:hover { background: var(--accent-soft); }
  /* The pager. A shelf of a thousand songs does not go on one page: a
     thousand covers is a thousand pictures to fetch and lay out, and nobody
     scrolls past the first fifty anyway. */
  .pager {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: center;
    margin: 28px auto 8px; padding: 0 20px;
  }
  .pager button {
    min-width: 34px; padding: 5px 10px; font: inherit; font-size: 13px;
    cursor: pointer; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel); color: inherit;
  }
  .pager button:hover:not(:disabled) { background: var(--accent-soft); }
  .pager button.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .gap { color: var(--muted); padding: 0 2px; }
  /* The filters.
     A thousand scores wants narrowing before it wants browsing, so these sit
     beside the shelf where there is room and above it where there is not. The
     instruments are grouped because nobody reads past thirty of anything to
     find a flute; the groups are in TAXONOMY.md, which says why each one is
     where it is. */
  .page {
    max-width: 1100px; margin: 0 auto;
    display: grid; gap: 24px; align-items: start;
    grid-template-columns: 218px minmax(0, 1fr);
  }
  .filters {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 14px 16px;
    position: sticky; top: 14px;
  }
  @media (max-width: 820px) {
    .page { grid-template-columns: 1fr; }
    .filters { position: static; }
  }
  .filters h2 {
    margin: 0; font-size: 15px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .filters h3 {
    margin: 15px 0 5px; font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .filters details { border-radius: 6px; }
  .filters summary {
    cursor: pointer; padding: 3px 2px; font-size: 13.5px;
    display: flex; align-items: center; gap: 6px; list-style: none;
  }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::before {
    content: "›"; width: 9px; color: var(--muted);
    transition: transform .12s ease;
  }
  .filters details[open] > summary::before { transform: rotate(90deg); }
  .filters summary:hover { color: var(--accent); }
  .n { color: var(--muted); font-size: 11.5px; margin-left: auto; }
  .row {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 2px 2px 2px 15px; font-size: 13.5px;
  }
  .row:hover { color: var(--accent); }
  .row input { margin: 0; cursor: pointer; }
  /* Nothing on the shelf is played by it, given everything else picked. Left
     in place rather than taken away, so the list does not jump about as you
     tick things. */
  .row.none-left { opacity: .4; }
  .clear {
    font: inherit; font-size: 12px; padding: 0; cursor: pointer;
    background: none; border: 0; color: var(--accent);
  }
  .tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .shelf {
    max-width: 1100px; margin: 0 auto;
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .score {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* The first page, which is what a shelf of music is read by: you know
     the piece by the look of it long before you read the title. */
  .score a.cover {
    display: block; background: var(--paper); line-height: 0;
    border-bottom: 1px solid var(--line);
  }
  .score img { width: 100%; height: auto; display: block; }
  .score .about { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .score h2 { margin: 0; font-size: 15px; line-height: 1.3; }
  .score h2 a { color: inherit; text-decoration: none; }
  .score h2 a:hover { text-decoration: underline; }
  .by, .pages { color: var(--muted); font-size: 13px; }
  .desc { font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .tags span {
    font-size: 11.5px; padding: 2px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--ink);
  }
  .links { margin-top: auto; padding-top: 8px; display: flex; gap: 10px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .none { max-width: 1100px; margin: 40px auto; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Scores</h1>
  <div class="count" id="count"></div>
</header>
<div class="controls">
  <input id="q" type="search" placeholder="Search titles, composers, words…" autocomplete="off">
  <span id="tags"></span>
</div>
<div class="page">
  <aside class="filters">
    <h2>Filters <button class="clear" id="clear" type="button" hidden>Clear all</button></h2>
    <div id="facet-difficulty" hidden>
      <h3>Difficulty</h3>
      <div id="difficulty"></div>
    </div>
    <div id="facet-instruments" hidden>
      <h3>Instruments</h3>
      <div id="instruments"></div>
    </div>
  </aside>
  <main>
    <div class="shelf" id="shelf"></div>
    <p class="none" id="none" hidden>Nothing matches.</p>
    <nav class="pager" id="pager" aria-label="Pages of the shelf"></nav>
  </main>
</div>

<script>
// The shelf is built from scores.json, which build.sh writes. Keeping the
// list out of the page means adding a score is adding a file and running
// the build — this page never changes.
const shelf = document.getElementById("shelf");
const countEl = document.getElementById("count");
const tagBar = document.getElementById("tags");
const instBar = document.getElementById("instruments");
const instFacet = document.getElementById("facet-instruments");
const diffBar = document.getElementById("difficulty");
const diffFacet = document.getElementById("facet-difficulty");
const clearBtn = document.getElementById("clear");
const pager = document.getElementById("pager");
const search = document.getElementById("q");
const none = document.getElementById("none");

let all = [];
let picked = new Set();
let played = new Set();
let levels = new Set();

// The instruments, grouped so that finding a flute is not reading past
// thirty entries. This is the machine-readable half of TAXONOMY.md, which
// says what each group is and why the arguable ones landed where they did.
//
// Anything gscore names that is missing here falls into "Other" rather than
// disappearing, so a new instrument reaches the shelf the day it exists.
const GROUPS = [
  ["Keyboard", ["piano", "bright piano", "electric piano", "harpsichord",
                "organ", "accordion", "celesta", "music box"]],
  ["Voice", ["voice", "choir"]],
  ["Woodwind", ["flute", "piccolo", "recorder", "pan flute", "ocarina",
                "oboe", "english horn", "clarinet", "bassoon",
                "soprano sax", "alto sax", "tenor sax", "baritone sax",
                "harmonica"]],
  ["Brass", ["trumpet", "trombone", "french horn", "tuba"]],
  ["Strings — bowed", ["violin", "viola", "cello", "contrabass", "strings"]],
  ["Strings — plucked", ["guitar", "electric guitar", "harp", "bass"]],
  ["Percussion", ["timpani", "glockenspiel", "marimba", "vibraphone"]],
];

// The difficulty words, hardest last rather than alphabetical: this is a
// scale and reading it out of order tells you nothing.
const LEVELS = ["beginner", "intermediate", "advanced"];

// How many scores go on one page of the shelf.
//
// A shelf of a thousand songs cannot be one page: it is a thousand covers to
// fetch and lay out, and nobody reaches the fiftieth. Sixty is a few screens
// of browsing and about a megabyte of pictures, which a page can afford.
const PER_PAGE = 60;
let page = 0;

const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function matches(s, skip) {
  // Every picked tag, not any of them: picking "flute" and "duet" means
  // flute duets, which is what picking two of anything usually means.
  for (const t of picked) {
    if (!(s.tags || []).some((x) => x.toLowerCase() === t)) return false;
  }
  // And every picked instrument, by the same rule: ticking voice and piano
  // asks for songs with a piano under them, not for everything with either.
  // That is the useful question — a shelf can already be searched for one
  // word.
  if (skip !== "instruments") {
    for (const i of played) {
      if (!(s.instruments || []).some((x) => x.toLowerCase() === i)) return false;
    }
  }
  // Difficulty is the other way about: any of them, not all. It is one word
  // out of a scale and a score carries one, so asking for both beginner and
  // advanced would always answer nothing — a filter that punishes you for
  // ticking twice.
  if (skip !== "difficulty" && levels.size) {
    if (!(s.tags || []).some((x) => levels.has(x.toLowerCase()))) return false;
  }
  const q = search.value.trim().toLowerCase();
  if (!q) return true;
  return [s.title, s.composer, s.description, ...(s.tags || [])]
    .filter(Boolean).join(" ").toLowerCase().includes(q);
}

function draw() {
  const shown = all.filter(matches);

  // Which page of them, and which scores are on it. The page is kept rather
  // than reset, so paging back and forth does not keep throwing you to the
  // front; narrowing the shelf past the page you are on brings you back to
  // the last one there is.
  const pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
  if (page >= pages) page = pages - 1;
  const from = page * PER_PAGE;
  const here = shown.slice(from, from + PER_PAGE);

  shelf.innerHTML = here.map((s) => `
    <div class="score">
      <a class="cover" href="${esc(s.slug)}/play.html">
        <img src="${esc(s.slug)}/cover.png" alt="The first page of ${esc(s.title)}" loading="lazy">
      </a>
      <div class="about">
        <h2><a href="${esc(s.slug)}/play.html">${esc(s.title)}</a></h2>
        ${s.composer ? `<div class="by">${esc(s.composer)}</div>` : ""}
        ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ""}
        ${s.pages ? `<div class="pages">${s.pages} page${s.pages === 1 ? "" : "s"}</div>` : ""}
        ${(s.tags || []).length
          ? `<div class="tags">${s.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="links">
          <a href="${esc(s.slug)}/play.html">Play</a>
          <!-- One file, two uses: a .gscore is also a valid PDF, so this
               opens in any reader and opens in gscore. -->
          <a href="${esc(s.slug)}/${esc(s.file)}" download>Download</a>
        </div>
      </div>
    </div>`).join("");
  none.hidden = shown.length > 0;
  const total = shown.length === all.length
    ? `${all.length} score${all.length === 1 ? "" : "s"}`
    : `${shown.length} of ${all.length}`;
  countEl.textContent = pages > 1
    ? `${total} — showing ${from + 1}–${from + here.length}`
    : total;
  drawPager(pages);
  drawFacets();
}

// The pager: a step either way, the ends always reachable, and a few numbers
// around where you are.
//
// Not every page as a button. A thousand songs is twenty-five pages and a
// corpus three times that is seventy-five, and a row of seventy-five numbers
// is not a thing anybody reads.
function drawPager(pages) {
  pager.innerHTML = "";
  if (pages <= 1) return;

  const go = (to, label, opts = {}) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (opts.on) b.className = "on";
    if (opts.dead) b.disabled = true;
    if (opts.on) b.setAttribute("aria-current", "page");
    b.onclick = () => {
      page = to;
      draw();
      // Back to the top: the shelf has been replaced under you, and reading
      // the middle of a page you have not seen the start of is no use.
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    pager.appendChild(b);
  };
  const gap = () => {
    const s = document.createElement("span");
    s.className = "gap";
    s.textContent = "…";
    pager.appendChild(s);
  };

  go(page - 1, "‹ Back", { dead: page === 0 });
  const want = new Set([0, pages - 1]);
  for (let i = page - 2; i <= page + 2; i++) {
    if (i >= 0 && i < pages) want.add(i);
  }
  let last = -1;
  for (const i of [...want].sort((a, b) => a - b)) {
    if (i - last > 1) gap();
    go(i, String(i + 1), { on: i === page });
    last = i;
  }
  go(page + 1, "Next ›", { dead: page === pages - 1 });
}

// Which groups the reader has opened, kept across redraws: the counts change
// every time anything is ticked, and a panel that folded itself up each time
// would be unusable.
let opened = new Set();

// One line of a filter: a box, a word, and how many scores it would leave.
function pickRow(label, count, on, toggle) {
  const row = document.createElement("label");
  row.className = count === 0 && !on ? "row none-left" : "row";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = on;
  box.onchange = () => {
    toggle(box.checked);
    page = 0;
    draw();
  };
  const name = document.createElement("span");
  name.textContent = label;
  const n = document.createElement("span");
  n.className = "n";
  n.textContent = count.toLocaleString();
  row.append(box, name, n);
  return row;
}

// The filters, and the number beside each one.
//
// A count is of what that word would leave given everything else picked, but
// not given its own facet — otherwise ticking one instrument puts a zero
// beside every other instrument, which tells the reader nothing and makes the
// panel look broken.
function drawFacets() {
  // Difficulty, hardest last. Only the words actually used appear: most of a
  // bulk-imported corpus has never been played by anybody here, and offering
  // a filter that matches nothing is worse than not offering it.
  const forLevels = all.filter((s) => matches(s, "difficulty"));
  const lc = new Map();
  for (const s of forLevels) {
    for (const t of (s.tags || []).map((x) => x.toLowerCase())) {
      if (LEVELS.includes(t)) lc.set(t, (lc.get(t) || 0) + 1);
    }
  }
  const shownLevels = LEVELS.filter((l) => lc.has(l) || levels.has(l));
  diffFacet.hidden = shownLevels.length === 0;
  diffBar.innerHTML = "";
  for (const l of shownLevels) {
    diffBar.appendChild(pickRow(
      l[0].toUpperCase() + l.slice(1), lc.get(l) || 0, levels.has(l),
      (on) => { if (on) levels.add(l); else levels.delete(l); }));
  }

  // Instruments, by group.
  const base = all.filter((s) => matches(s, "instruments"));
  const ic = new Map();
  for (const s of base) {
    for (const v of new Set((s.instruments || []).map((x) => x.toLowerCase()))) {
      ic.set(v, (ic.get(v) || 0) + 1);
    }
  }
  // Anything gscore names that no group claims, so nothing is unreachable.
  const known = new Set(GROUPS.flatMap(([, list]) => list));
  const loose = [...new Set(all.flatMap((s) =>
    (s.instruments || []).map((x) => x.toLowerCase())))]
    .filter((i) => !known.has(i)).sort();
  const groups = loose.length ? [...GROUPS, ["Other", loose]] : GROUPS;

  instBar.innerHTML = "";
  let any = false;
  for (const [name, list] of groups) {
    const here = list.filter((i) => ic.has(i) || played.has(i));
    if (!here.length) continue;
    any = true;
    // Scores, not instruments: a song for voice and piano is one score in
    // Keyboard, not two, and adding the lines up would say otherwise.
    const total = base.filter((s) => (s.instruments || [])
      .some((x) => here.includes(x.toLowerCase()))).length;

    const group = document.createElement("details");
    group.open = opened.has(name) || here.some((i) => played.has(i));
    group.addEventListener("toggle", () => {
      if (group.open) opened.add(name); else opened.delete(name);
    });
    const head = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = name;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = total.toLocaleString();
    head.append(label, n);
    group.appendChild(head);
    for (const i of here) {
      group.appendChild(pickRow(i, ic.get(i) || 0, played.has(i),
        (on) => { if (on) played.add(i); else played.delete(i); }));
    }
    instBar.appendChild(group);
  }
  instFacet.hidden = !any;
  clearBtn.hidden = !(played.size || levels.size || picked.size);
}

function drawTags() {
  const seen = new Map();
  for (const s of all) {
    for (const t of s.tags || []) {
      const key = t.toLowerCase();
      if (!seen.has(key)) seen.set(key, t);
    }
  }
  tagBar.innerHTML = "";
  for (const [key, label] of [...seen].sort((a, b) => a[0].localeCompare(b[0]))) {
    const b = document.createElement("button");
    b.className = "tag";
    b.type = "button";
    b.textContent = label;
    b.onclick = () => {
      if (picked.has(key)) picked.delete(key); else picked.add(key);
      b.classList.toggle("on", picked.has(key));
      // Narrowing the shelf starts it again from the front: page nine of
      // what you were looking at before is nowhere in what you asked for.
      page = 0;
      draw();
    };
    tagBar.appendChild(b);
  }
}

search.addEventListener("input", () => { page = 0; draw(); });

// Back to the whole shelf. The search box is left alone: it is typed into
// rather than ticked, and clearing what somebody wrote is a different and
// more annoying thing than clearing what they picked.
clearBtn.onclick = () => {
  played.clear();
  levels.clear();
  picked.clear();
  page = 0;
  drawTags();
  draw();
};

fetch("scores.json")
  .then((r) => r.json())
  .then((rows) => { all = rows; drawTags(); draw(); })
  .catch(() => {
    countEl.textContent = "scores.json is not here — run build.sh";
  });
</script>
</body>
</html>
