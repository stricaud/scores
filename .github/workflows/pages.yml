#
# Builds the shelf and publishes it to GitHub Pages.
#
# Nothing here runs a server: gscore writes pages that play the music by
# themselves, so what is published is files. The build is the only moving
# part, and it runs when a score is pushed.

name: Build the shelf

on:
  push:
    branches: [main]
  # So the shelf can be rebuilt after gscore itself changes, without
  # having to touch a score to make it happen.
  workflow_dispatch:

# One at a time, and let a newer push win: two builds racing to publish
# would leave whichever finished last, which is not necessarily the newer.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gscore is built from source, at the revision GSCORE_REV names.
      #
      # Not from HEAD, though it was for a while: gscore moves several times
      # a day, and the engraved pages are cached against the engraver that
      # drew them, so a shelf drawn by HEAD was redrawn from nothing on every
      # push — twenty minutes of engraving for one new song. Bump GSCORE_REV
      # when gscore has changed something worth redrawing the shelf for.
      - id: engraver
        run: echo "sha=$(grep -v '^#' GSCORE_REV | tr -d ' \n')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: stricaud/gscore
          ref: ${{ steps.engraver.outputs.sha }}
          path: .gscore-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: .gscore-src/go.mod
          cache-dependency-path: .gscore-src/go.sum
      # CGO_ENABLED=0 because with cgo on, gscore links a native window
      # through webview, which wants gtk+-3.0 and webkit2gtk — neither of
      # which the runner has, and neither of which the shelf needs: the
      # only thing asked of gscore here is -describe. gscore's
      # internal/desktop has a !cgo build that leaves the window out, so
      # this is the same binary its own Makefile ships for Linux.
      #
      # -trimpath so that the same source gives the same bytes wherever it
      # is built: build.sh keys its cache on a hash of the binary.
      - name: Build gscore
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/gscore" .
        working-directory: .gscore-src

      # pdftoppm turns each score's first page into the picture on the
      # shelf. ffmpeg encodes the recordings, and the soundfont is what they
      # are recorded through — from Ubuntu's own packages rather than a
      # download, so there is no third-party address to go stale.
      - name: Install poppler, ffmpeg and a soundfont
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg fluid-soundfont-gm

      # The recordings, kept between builds.
      #
      # Recording is far and away the slowest thing here — the ninth
      # symphony is three quarters of an hour of audio and takes about seven
      # minutes to render and encode — and a score does not change once it
      # is on the shelf. So the key is what the scores hash to: unchanged,
      # the whole lot comes back and nothing is recorded; add one, and the
      # restore-key brings back the rest so only the new score is.
      - uses: actions/cache@v4
        with:
          path: .audio-cache
          key: audio-${{ hashFiles('**/*.gscore') }}
          restore-keys: |
            audio-

      # The engraved pages, kept between builds.
      #
      # Every score is engraved to publish it — once to read what it says,
      # once for the page — and a shelf of a thousand imported songs is
      # minutes of that on every build, for music that has not changed.
      # build.sh keeps the results under .build-cache and this carries them
      # from one run to the next.
      #
      # The key is the scores, the recipe that engraves them and the gscore
      # revision, which is what the pages depend on; anything else is noise
      # that would make a fresh key and a cold cache. The restore-key brings
      # back the last cache of pages whatever it was keyed on, and build.sh
      # decides inside what is still good: each entry is keyed on a hash of
      # the gscore binary and of engrave.sh, so a cache restored against the
      # wrong engraver misses rather than being believed. The key is the
      # optimisation; the check inside is the guarantee.
      - uses: actions/cache@v4
        with:
          path: .build-cache
          key: pages-${{ hashFiles('**/*.gscore', 'engrave.sh', 'GSCORE_REV') }}
          restore-keys: |
            pages-

      # build.sh finds the soundfont installed above for itself, and says in
      # its output whether it is recording or leaving the pages to make
      # their own sound. A score it has a recording for already costs
      # nothing here; a new symphony is about seven minutes. Scores are
      # engraved as many at a time as the runner has processors.
      # What the runner has to work with, said once at the top of the log. A
      # build that was shut down twice for want of it left no other trace.
      - name: Room on the runner
        run: df -h / "$RUNNER_TEMP" && free -m && nproc

      - name: Build the shelf
        run: ./build.sh "$RUNNER_TEMP/gscore"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
